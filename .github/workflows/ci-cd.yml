name: Student Placement CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Validate Airflow project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Student Placement Project"
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__DAGS_FOLDER: "${{ github.workspace }}/Student Placement Project/dags"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: "${{ github.workspace }}/Student Placement Project"

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Student Placement Project/requirements-airflow.txt

      - name: Install Airflow and DAG dependencies
        run: >-
          python -m pip install
          "apache-airflow==2.11.2"
          -r requirements-airflow.txt
          --constraint
          https://raw.githubusercontent.com/apache/airflow/constraints-2.11.2/constraints-3.12.txt

      - name: Initialize Airflow metadata database
        run: airflow db migrate

      - name: Check DAG imports
        run: airflow dags list-import-errors

      - name: Confirm project DAG is registered
        run: |
          airflow dags list --output json > dags.json
          python -c "import json; dags=json.load(open('dags.json')); assert any(dag['dag_id'] == 'ml_pipeline' for dag in dags), 'ml_pipeline was not discovered'"

      - name: Check Python syntax
        run: python -m compileall -q dags src

  publish:
    name: Build and publish Airflow image
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: "./Student Placement Project"
          file: "./Student Placement Project/Dockerfile"
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
